name: birdvox-heldout-three-sensor-replication

on:
  pull_request:
    paths:
      - '.github/workflows/birdvox-heldout-confirmatory.yml'
      - 'scripts/score_birdvox_band_energy.py'
      - 'scripts/build_birdvox_exposure_grid.py'
      - 'scripts/analyze_birdvox_exposure_grid.py'
      - 'scripts/analyze_birdvox_grouped_uncertainty.py'
      - 'BIRDVOX_REPLICATION.md'
  workflow_dispatch:

jobs:
  heldout-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install real-data scoring dependencies
        run: python -m pip install --disable-pip-version-check numpy soundfile

      - name: Download frozen BirdVox v3 heldout inputs
        run: |
          mkdir -p /tmp/birdvox-heldout
          for unit in 02 05 10; do
            curl -L --fail --retry 3 \
              "https://zenodo.org/records/1205569/files/BirdVox-full-night_flac-audio_unit${unit}.flac?download=1" \
              -o "/tmp/birdvox-heldout/BirdVox-full-night_flac-audio_unit${unit}.flac"
            curl -L --fail --retry 3 \
              "https://zenodo.org/records/1205569/files/BirdVox-full-night_csv-annotations_unit${unit}.csv?download=1" \
              -o "/tmp/birdvox-heldout/BirdVox-full-night_csv-annotations_unit${unit}.csv"
          done

      - name: Verify frozen v3 file hashes
        working-directory: /tmp/birdvox-heldout
        run: |
          cat > checksums.md5 <<'EOF'
          70ba6b785a0a8dfaf06da67c58b5660b  BirdVox-full-night_flac-audio_unit02.flac
          9d924ec80c75ea15f58406b32b1bfc5f  BirdVox-full-night_flac-audio_unit05.flac
          da23c632bcc466f88d7eb7ab6ad152f3  BirdVox-full-night_flac-audio_unit10.flac
          831f62043b2c404cedb7004032905408  BirdVox-full-night_csv-annotations_unit02.csv
          b1aeb87763990856d92d6db162a8c5a0  BirdVox-full-night_csv-annotations_unit05.csv
          bfe4a6e45731f468cc6dbea0a7968c1c  BirdVox-full-night_csv-annotations_unit10.csv
          EOF
          md5sum -c checksums.md5

      - name: Generate annotation-naive continuous scores and audio denominators
        run: |
          python scripts/score_birdvox_band_energy.py \
            /tmp/birdvox-heldout/BirdVox-full-night_flac-audio_unit02.flac \
            /tmp/birdvox-heldout/BirdVox-full-night_flac-audio_unit05.flac \
            /tmp/birdvox-heldout/BirdVox-full-night_flac-audio_unit10.flac \
            --window-seconds 1 \
            --scores-output /tmp/birdvox-heldout/birdvox_scores.csv \
            --manifest-output /tmp/birdvox-heldout/birdvox_manifest.csv
          cat /tmp/birdvox-heldout/birdvox_manifest.csv

      - name: Build gate-independent heldout exposure universe
        run: |
          python scripts/build_birdvox_exposure_grid.py \
            /tmp/birdvox-heldout/birdvox_manifest.csv \
            /tmp/birdvox-heldout/birdvox_scores.csv \
            /tmp/birdvox-heldout/BirdVox-full-night_csv-annotations_unit02.csv \
            /tmp/birdvox-heldout/BirdVox-full-night_csv-annotations_unit05.csv \
            /tmp/birdvox-heldout/BirdVox-full-night_csv-annotations_unit10.csv \
            --window-seconds 1 \
            --output /tmp/birdvox-heldout/birdvox_exposure_grid.csv

      - name: Analyze frozen z=2 and z=4 gates
        run: |
          python scripts/analyze_birdvox_exposure_grid.py \
            /tmp/birdvox-heldout/birdvox_exposure_grid.csv \
            --threshold 2 \
            --threshold 4 \
            --output /tmp/birdvox-heldout/birdvox_heldout_results.json
          cat /tmp/birdvox-heldout/birdvox_heldout_results.json

      - name: Analyze grouped sensor/night-block uncertainty
        run: |
          python scripts/analyze_birdvox_grouped_uncertainty.py \
            /tmp/birdvox-heldout/birdvox_exposure_grid.csv \
            --threshold 2 \
            --threshold 4 \
            --block-seconds 1800 \
            --bootstrap-reps 2000 \
            --seed 20260904 \
            --output /tmp/birdvox-heldout/birdvox_grouped_uncertainty.json
          cat /tmp/birdvox-heldout/birdvox_grouped_uncertainty.json

      - name: Package inspectable heldout artifacts
        uses: actions/upload-artifact@v4
        with:
          name: birdvox-heldout-three-sensor-replication
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/birdvox-heldout/birdvox_manifest.csv
            /tmp/birdvox-heldout/birdvox_scores.csv
            /tmp/birdvox-heldout/birdvox_exposure_grid.csv
            /tmp/birdvox-heldout/birdvox_heldout_results.json
            /tmp/birdvox-heldout/birdvox_grouped_uncertainty.json
