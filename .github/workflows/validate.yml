name: validate-rec

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run REC schema and analysis tests
        run: python -m unittest discover -s tests -v
      - name: Validate Chapter 2 example window table
        run: |
          python scripts/validate_chapter2_windows.py \
            examples/chapter2_windows.csv \
            --summary /tmp/chapter2_summary.json
          cat /tmp/chapter2_summary.json
      - name: Validate REC master exposure ledger
        run: |
          python scripts/validate_exposure_ledger.py \
            examples/exposure_ledger.csv \
            --window-table examples/chapter2_windows.csv \
            --summary /tmp/exposure_ledger_summary.json
          cat /tmp/exposure_ledger_summary.json
      - name: Analyze REC example shadow selection
        run: |
          python scripts/analyze_shadow_selection.py \
            examples/exposure_ledger.csv \
            examples/chapter2_windows.csv \
            --output /tmp/shadow_selection.json
          cat /tmp/shadow_selection.json
