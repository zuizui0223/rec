name: findlay-camera-trap-real-data-validation

on:
  pull_request:
    paths:
      - '.github/workflows/findlay-ct-real-data.yml'
      - 'scripts/analyze_findlay_ct_shadow.py'
      - 'tests/test_findlay_ct_shadow.py'
  workflow_dispatch:

jobs:
  findlay-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download commit-pinned Findlay camera-trap tables
        run: |
          set -euo pipefail
          D=/tmp/findlay-ct
          mkdir -p "$D"
          BASE='https://raw.githubusercontent.com/melaniefindlay/CT-Detection/abc72f535bb59ebed202fb7acca852fc1647e97a'
          curl -L --fail --retry 3 "$BASE/REGISTRATION_FOX_BADGER.csv" -o "$D/REGISTRATION_FOX_BADGER.csv"
          curl -L --fail --retry 3 "$BASE/TRIGGER_OTTER_WET.DRY.csv" -o "$D/TRIGGER_OTTER_WET.DRY.csv"

      - name: Verify exact upstream Git blob identities
        run: |
          set -euo pipefail
          test "$(git hash-object /tmp/findlay-ct/REGISTRATION_FOX_BADGER.csv)" = 'd2dc9852ca1f2a1380b991acba425d16e12327d5'
          test "$(git hash-object /tmp/findlay-ct/TRIGGER_OTTER_WET.DRY.csv)" = '1f2fef008470ad1263d76beeb5be2b7006ff85aa'

      - name: Run REC pass-trigger-capture validation
        run: |
          python scripts/analyze_findlay_ct_shadow.py \
            /tmp/findlay-ct/REGISTRATION_FOX_BADGER.csv \
            /tmp/findlay-ct/TRIGGER_OTTER_WET.DRY.csv \
            --output /tmp/findlay-ct/findlay_rec_result.json
          cat /tmp/findlay-ct/findlay_rec_result.json

      - name: Upload inspectable result
        uses: actions/upload-artifact@v4
        with:
          name: findlay-camera-trap-rec-validation
          if-no-files-found: error
          retention-days: 14
          path: /tmp/findlay-ct/findlay_rec_result.json
